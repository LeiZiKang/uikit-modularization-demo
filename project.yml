name: ModularDemo
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  Components:
    path: Packages/Components
  DataModel:
    path: Packages/DataModel
  DevTools:
    path: Packages/DevTools
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ModularDemo:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.modular-demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: Components
      - package: DataModel
      - package: DevTools
  ModularDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.modular-demo.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ModularDemo
schemes:
  ModularDemo:
    build:
      targets:
        ModularDemo: all
    test:
      targets: [ModularDemoTests]
