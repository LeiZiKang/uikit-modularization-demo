name: ModularDemo
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ProductUI:
    path: Packages/ProductUI
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ModularDemo:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.modular-demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: ProductUI
schemes:
  ModularDemo:
    build:
      targets:
        ModularDemo: all
